<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Gill Sans', 'Gill Sans MT', 'Calibri', 'Trebuchet MS', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            background-color: rgba(197, 197, 197, 0.747);
        }
        
        form{
            background-color: purple;
            width: 400px;
            border-radius: 10px;
            border: 1px solid black;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0);
            padding: 15px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            padding-top: 5px;
        }

        input{
            width: 100%;
            margin-bottom: 5px;
            padding: 5px;
            border: none;
            box-shadow: 2px 1px 5px 0px rgb(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        button{
            width: 100%;
            padding: 1px;
            border-radius: 10px;
            margin-top: 20px;
        }

    </style>
</head>
<body>
    
    <form id="form">
        <h1>Login</h1>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email">

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" >

        <button id="enviar" onclick="validarFormulario()">Enviar</button>
    </form>

    <script>

        function validarFormulario(){
            let email = document.getElementById('email').value;
            let senha = document.getElementById('senha').value;

            if (email === "" || senha === ""){
                alert("Preencha todos os campos!");
            }
            else if (email === "luiz@gmail.com" && senha === "12345"){
                window.document.href = "page2.html"
            }
            else{
                alert("Email ou Senha incorreta!");
            }
        }

    </script>
</body>
</html>
